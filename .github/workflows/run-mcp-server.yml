name: Run MCP Common Server

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-server:
    runs-on: windows-latest

    steps:
      - name: Clone mcp-common-server
        run: |
          git clone https://github.com/tamilts124/mcp-common-server.git mcp-common-server

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: mcp-common-server
        run: npm install

      - name: Create .env from vars and secrets
        working-directory: mcp-common-server
        run: |
          $rootPath = "${{ github.workspace }}\mcp-common-server"
          @"
          PORT=${{ vars.PORT }}
          MCP_ROOTS=$rootPath
          MCP_READ_ONLY=${{ vars.MCP_READ_ONLY }}
          MCP_ALLOW_EXEC=${{ vars.MCP_ALLOW_EXEC }}
          MCP_CMD_TIMEOUT=${{ vars.MCP_CMD_TIMEOUT }}
          MCP_IGNORE=${{ vars.MCP_IGNORE }}
          EMAIL_USERNAME=${{ secrets.EMAIL_USERNAME }}
          EMAIL_APP_PASSWORD=${{ secrets.EMAIL_APP_PASSWORD }}
          GH_TOKEN=${{ secrets.GH_TOKEN }}
          "@ | Out-File -FilePath .env -Encoding utf8

      - name: Start MCP Server
        working-directory: mcp-common-server
        run: |
          node .\server-http.js --category=email_database,execution_process,git,write_edit,read_file_system,browser_automation
